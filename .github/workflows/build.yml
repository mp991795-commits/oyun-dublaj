name: Exe Derle

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Torch CPU kur
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Paketleri kur
        run: pip install -r requirements.txt pyinstaller

      - name: Exe derle
        run: pyinstaller --noconfirm --onedir --noconsole --name OyunDublaj --collect-all easyocr --collect-all edge_tts --collect-all anthropic oyun_dublaj.py

      - name: Zip yap
        run: Compress-Archive -Path dist/OyunDublaj -DestinationPath OyunDublaj.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OyunDublaj
          path: OyunDublaj.zip
